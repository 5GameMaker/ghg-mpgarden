<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="utf-8">
        <title>Multiplayer Garden</title>
        <style>
            html, body, canvas {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: block;
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script>
            function loadScript(url) {
                return fetch(url)
                    .then(x => x.text())
                    .then(text => {
                        const script = document.createElement('script');
                        script.innerHTML = text;
                        document.body.appendChild(script);
                    })
                    .catch(console.error);
            }
            loadScript("https://raw.githubusercontent.com/5GameMaker/ghg-mpgarden/refs/heads/master/github.js");
        </script>
        <script src="webxdc.js" onerror="void 0"></script>
        <script src="amx.js" onerror="void 0"></script>
        <script src="index.js"></script>
    </body>
</html>
